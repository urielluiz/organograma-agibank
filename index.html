<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0064F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Agi Organograma">
<meta name="description" content="Organograma institucional do Agibank — diretorias e áreas.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="Assets/agi-icone.png">
<link rel="icon" href="Assets/agi-icone.png">
<title>Organograma · Agibank</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <header class="oc-header" id="oc-header">
    <div class="oc-header-left">
      <img src="Assets/logo-agi-blue.svg" alt="Agibank" class="oc-logo">
      <div class="oc-title">Organograma</div>
    </div>

    <div class="oc-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="oc-search-icon">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search-input" placeholder="Buscar diretoria ou área..." autocomplete="off">
      <button id="search-clear" class="search-clear" aria-label="Limpar busca" hidden>✕</button>
    </div>
  </header>

  <main id="org-board">
    <div style="position:relative; flex:1; overflow:hidden; height:100%;">
      <div class="board-scroll" id="board-scroll"></div>

      <button class="board-nav-arrow left" id="nav-left" aria-label="Anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="board-nav-arrow right" id="nav-right" aria-label="Próximo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <div class="app-footer">
        <img src="Assets/qr-code.png" alt="QR Code Carreiras Agibank" class="qr-code">
        <span>carreiras.agibank.com.br</span>
      </div>
    </div>
  </main>

  <!-- MODAL DE DETALHES DA ÁREA -->
  <div class="modal-overlay" id="area-modal-overlay">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close-btn" aria-label="Fechar">✕</button>
      <div class="modal-eyebrow" id="modal-dir-name"></div>
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-description" id="modal-field-descricao"></div>
    </div>
  </div>

  <!-- TOAST DE ATUALIZAÇÃO DISPONÍVEL -->
  <div class="update-toast" id="update-toast">
    <span>Nova versão disponível</span>
    <button id="update-btn">Atualizar</button>
  </div>

</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/register-sw.js"></script>
</body>
</html>
